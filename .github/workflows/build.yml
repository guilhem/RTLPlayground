name: Build firmware

on:
  push:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.machine }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with the selectable targets in machine.h.
        machine:
          - KP_9000_6XHML_X2
          - KP_9000_6XH_X2
          - KP_9000_6XH_X2_V1_1
          - KP_9000_6XHML_X2_V1_1
          - KP_9000_6XH_X2_V1_2
          - KP_9000_6XHML_X2_V1_2
          - KP_9000_6XH_X2_V2_1
          - KP_9000_6XHML_X2_V2_1
          - KP_9000_6XH_X
          - KP_9000_9XH_X_EU
          - KP_9000_9XHML_X_V2_2
          - KP_9000_9XHML_X_V3_1
          - SWGT024_V2_0_MANAGED
          - SWGT024_V2_0_UNMANAGED
          - TRENDNET_TEG_S562
          - HG0402XG_V1_1
          - SWTG018AS_A_V_2_0
          - SWTGW218AS
          - PCB_SWTG018AS_V2_1_0
          - PCB_K0402WS_V3
          - PCB_K0402WS_V2
          - K0501W_V2_0
          - LIANGUO_ZX_SWTGW215AS
          - ZX310S_4T2XH
          - ZX310S_4T2XT
          - STEAMEMO_IG204_V1
          - DEFAULT_8C_1SFP
          - HI_K0801WS
          - FNS1200P
          - PCB_SWTG024AS_A_2_0_1
          - SWTG024AS_A_2_0_1_5C_1SFP
          - SWTG024AS_V2_0
          - FG_4GT_2SX_V2_0
          - FG_8GT_1SX
    env:
      MACHINE: ${{ matrix.machine }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make gcc sdcc binutils xxd python3 libjson-c-dev zlib1g-dev git ca-certificates

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build firmware and OEM installer
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tags must use vX.Y.Z or vX.Y.Z-prerelease"
              exit 1
            fi
            make MACHINE="$MACHINE" VERSION="${RELEASE_TAG#v}"
          else
            make MACHINE="$MACHINE"
          fi
          make -C installer

      - name: Verify and collect images
        run: |
          test -s output/rtlplayground.bin
          test -s installer/output/rtlplayground_oem_upgrade.bin
          tools/output/crc_calculator -v output/rtlplayground.bin
          firmware=$(basename "$(readlink output/rtlplayground.bin)")
          commit=$(git rev-parse --short HEAD)
          [[ "$firmware" == *-"$commit"-"$MACHINE".bin ]]
          mkdir -p dist
          cp output/rtlplayground.bin "dist/$firmware"
          cp installer/output/rtlplayground_oem_upgrade.bin "dist/${firmware%.bin}-oem-upgrade.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: rtlplayground-${{ matrix.machine }}-${{ github.sha }}
          path: dist/*.bin
          if-no-files-found: error
          overwrite: true

  release:
    name: Attach release images
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rtlplayground-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.bin --clobber
